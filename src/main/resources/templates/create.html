<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Investment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/investment/home">Investment Tracker</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/investment/home">Home</a>
            <a class="nav-link active" href="/investment/create">New Investment</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h1>Add Investment</h1>
    <form th:action="@{/investment/create}" method="post" th:object="${investment}" onsubmit="submitInvestment(event)">
        <div class="mb-3">
            <label for="name" class="form-label">Investment Name</label>
            <input type="text" class="form-control" id="name" th:field="*{name}" required>
        </div>
        <div class="mb-3">
            <label for="amount" class="form-label">Amount</label>
            <input type="number" class="form-control" id="amount" th:field="*{amount}" step="0.01" required>
        </div>
        <button type="submit" class="btn btn-primary">Create Investment</button>
    </form>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Investment Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/investment/home">Investment Tracker</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/investment/home">Home</a>
        </div>
    </div>
</nav>
<div class="container mt-4">
    <h1>Investment Details</h1>
    <div>
        <p><strong>ID:</strong> <span th:text="${investment.id}"></span></p>
        <p><strong>Name:</strong> <span th:text="${investment.name}"></span></p>
        <p><strong>Amount:</strong> <span th:text="${'$' + #numbers.formatDecimal(investment.amount, 0, 'COMMA', 2, 'POINT')}"></span></p>
        <p><strong>Created At:</strong> <span th:text="${#temporals.format(investment.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></span></p>
    </div>

    <h2 class="mt-4">Edit Investment</h2>
    <form th:action="@{/investment/edit/{id}(id=${investment.id})}" method="post">
        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name" name="name" th:value="${investment.name}" required>
        </div>
        <div class="mb-3">
            <label for="amount" class="form-label">Amount</label>
            <input type="number" class="form-control" id="amount" name="amount" th:value="${investment.amount}" required step="0.01">
        </div>
        <button type="submit" class="btn btn-primary">Update</button>
    </form>

    <form th:action="@{/investment/delete/{id}(id=${investment.id})}" method="post" class="mt-3">
        <button type="submit" class="btn btn-danger" onclick="return confirm('Are you sure you want to delete this investment?')">Delete Investment</button>
    </form>

    <a href="/investment/home" class="btn btn-secondary mt-3">Back to Home</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
